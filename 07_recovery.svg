<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <title>07 Recovery State (Scenario 7)</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-weight: 700; fill: #1A1F26; }
      .subtitle { font-weight: 400; fill: #4A5568; }
      .label { font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; font-size: 11px; }
      .btn-text { font-weight: 600; font-size: 15px; text-anchor: middle; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="375" height="812" fill="#F8F9FA" />
  
  <!-- Header Bar -->
  <g id="Header" transform="translate(20, 20)">
    <rect width="28" height="28" rx="6" fill="#2B6CB0" />
    <text x="14" y="19" fill="#FFFFFF" font-weight="700" font-size="13" text-anchor="middle">NS</text>
    <text x="36" y="20" fill="#1A1F26" font-weight="700" font-size="16">NextStep</text>
    <text x="335" y="19" fill="#6C7A89" font-size="11" text-anchor="end">HAZHTeq Prototype</text>
    <line x1="0" y1="36" x2="335" y2="36" stroke="#E2E8F0" stroke-width="1" />
  </g>
  
  
  <!-- Screen: Recovery (Scenario 7) -->
  <g id="Screen_Recovery" transform="translate(20, 80)">
    <g id="Recovery_Banner">
      <rect width="335" height="100" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="2" />
      <text x="16" y="34" fill="#92400E" font-weight="700" font-size="18">That didn't go as expected.</text>
      <text x="16" y="58" fill="#78350F" font-size="13">Let's understand what changed before</text>
      <text x="16" y="76" fill="#78350F" font-size="13">deciding what to do next.</text>
    </g>

    <g id="What_Changed_Box" transform="translate(0, 115)">
      <rect width="335" height="90" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
      <text x="16" y="26" class="label" fill="#6C7A89">WHAT CHANGED</text>
      <text x="16" y="50" fill="#1A1F26" font-size="13" font-weight="600">Your manager replied angrily and copied HR.</text>
      <text x="16" y="70" fill="#6C7A89" font-size="12">Current goal: Cool things down, don't win argument.</text>
    </g>

    <g id="Recovery_Buttons" transform="translate(0, 225)">
      <g transform="translate(0, 0)">
        <rect width="335" height="50" rx="10" fill="#2B6CB0" />
        <text x="167" y="31" fill="#FFFFFF" class="btn-text">Help me decide what to do next</text>
      </g>
      <g transform="translate(0, 62)">
        <rect width="335" height="50" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="167" y="31" fill="#1A1F26" class="btn-text">Review what I sent</text>
      </g>
      <g transform="translate(0, 124)">
        <rect width="335" height="50" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
        <text x="167" y="31" fill="#1A1F26" class="btn-text">Show what changed</text>
      </g>
    </g>
  </g>

</svg>