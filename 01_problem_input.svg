<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <title>01 Problem Input Screen</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-weight: 700; fill: #1A1F26; }
      .subtitle { font-weight: 400; fill: #4A5568; }
      .label { font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; font-size: 11px; }
      .btn-text { font-weight: 600; font-size: 15px; text-anchor: middle; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="375" height="812" fill="#F8F9FA" />
  
  <!-- Header Bar -->
  <g id="Header" transform="translate(20, 20)">
    <rect width="28" height="28" rx="6" fill="#2B6CB0" />
    <text x="14" y="19" fill="#FFFFFF" font-weight="700" font-size="13" text-anchor="middle">NS</text>
    <text x="36" y="20" fill="#1A1F26" font-weight="700" font-size="16">NextStep</text>
    <text x="335" y="19" fill="#6C7A89" font-size="11" text-anchor="end">HAZHTeq Prototype</text>
    <line x1="0" y1="36" x2="335" y2="36" stroke="#E2E8F0" stroke-width="1" />
  </g>
  
  
  <!-- Screen: Problem Input -->
  <g id="Screen_ProblemInput" transform="translate(20, 80)">
    <text x="0" y="24" class="title" font-size="24">What's going on?</text>
    <text x="0" y="50" class="subtitle" font-size="14">Tell me what's happening. You don't have to organize it first.</text>
    
    <!-- Textarea Frame -->
    <g id="InputArea" transform="translate(0, 75)">
      <rect width="335" height="180" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
      <text x="16" y="32" fill="#1A1F26" font-size="14">Viva is at 10am tomorrow, laptop won't boot,</text>
      <text x="16" y="54" fill="#1A1F26" font-size="14">my project partner has been ignoring my calls</text>
      <text x="16" y="76" fill="#1A1F26" font-size="14">for 2 days, and my dad just got admitted to</text>
      <text x="16" y="98" fill="#1A1F26" font-size="14">a hospital in Surat. I'm in Pune.</text>
      <text x="16" y="165" fill="#94A3B8" font-size="11">Supports long text, mixed language / Hinglish</text>
      <text x="320" y="165" fill="#94A3B8" font-size="11" text-anchor="end">184 chars</text>
    </g>

    <!-- Jugaad Review Cushion -->
    <g id="Jugaad_Cushion" transform="translate(0, 275)">
      <rect width="335" height="110" rx="12" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.5" />
      <circle cx="24" cy="24" r="8" fill="#075985" />
      <path d="M24 20 L24 25 M24 27 L24 28" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
      <text x="40" y="28" fill="#075985" font-weight="600" font-size="13">Taking a breath before we process…</text>
      <rect x="16" y="44" width="303" height="4" rx="2" fill="#E0F2FE" />
      <rect x="16" y="44" width="180" height="4" rx="2" fill="#2B6CB0" />
      
      <!-- Cushion Buttons -->
      <g id="Btn_Review" transform="translate(16, 62)">
        <rect width="140" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
        <text x="70" y="23" fill="#1A1F26" class="btn-text" font-size="13">✏️ Review / Edit</text>
      </g>
      <g id="Btn_ProcessNow" transform="translate(166, 62)">
        <rect width="153" height="36" rx="8" fill="#2B6CB0" />
        <text x="76" y="23" fill="#FFFFFF" class="btn-text" font-size="13">Process right now →</text>
      </g>
    </g>

    <!-- Primary Button -->
    <g id="Btn_Submit" transform="translate(0, 410)">
      <rect width="335" height="52" rx="12" fill="#2B6CB0" />
      <text x="167" y="32" fill="#FFFFFF" class="btn-text">Help me figure this out</text>
    </g>
  </g>

</svg>