<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <title>04 Clarification Question Screen</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-weight: 700; fill: #1A1F26; }
      .subtitle { font-weight: 400; fill: #4A5568; }
      .label { font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; font-size: 11px; }
      .btn-text { font-weight: 600; font-size: 15px; text-anchor: middle; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="375" height="812" fill="#F8F9FA" />
  
  <!-- Header Bar -->
  <g id="Header" transform="translate(20, 20)">
    <rect width="28" height="28" rx="6" fill="#2B6CB0" />
    <text x="14" y="19" fill="#FFFFFF" font-weight="700" font-size="13" text-anchor="middle">NS</text>
    <text x="36" y="20" fill="#1A1F26" font-weight="700" font-size="16">NextStep</text>
    <text x="335" y="19" fill="#6C7A89" font-size="11" text-anchor="end">HAZHTeq Prototype</text>
    <line x1="0" y1="36" x2="335" y2="36" stroke="#E2E8F0" stroke-width="1" />
  </g>
  
  
  <!-- Screen: Clarification Question -->
  <g id="Screen_Clarification" transform="translate(20, 80)">
    <text x="0" y="16" fill="#6C7A89" font-size="12" font-weight="600">Question 1 of 2</text>
    <text x="335" y="16" fill="#B45309" font-size="12" font-weight="700" text-anchor="end">Needed to decide</text>
    
    <g id="Question_Card" transform="translate(0, 30)">
      <rect width="335" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
      <text x="20" y="40" class="title" font-size="18">Do you need to travel to</text>
      <text x="20" y="65" class="title" font-size="18">Surat tonight?</text>
      
      <!-- Choices -->
      <g id="Option_1" transform="translate(20, 95)">
        <rect width="295" height="50" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
        <text x="16" y="31" fill="#1A1F26" font-weight="600" font-size="14">Yes, I need to go tonight</text>
        <text x="275" y="31" fill="#94A3B8" font-size="14">→</text>
      </g>
      <g id="Option_2" transform="translate(20, 155)">
        <rect width="295" height="50" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
        <text x="16" y="31" fill="#1A1F26" font-weight="600" font-size="14">No, family has it covered</text>
        <text x="275" y="31" fill="#94A3B8" font-size="14">→</text>
      </g>
      <g id="Option_3" transform="translate(20, 215)">
        <rect width="295" height="50" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
        <text x="16" y="31" fill="#1A1F26" font-weight="600" font-size="14">Not sure yet</text>
        <text x="275" y="31" fill="#94A3B8" font-size="14">→</text>
      </g>

      <!-- Custom Answer -->
      <g id="Custom_Answer" transform="translate(20, 280)">
        <text x="0" y="16" fill="#6C7A89" font-size="12">Or provide your own answer:</text>
        <rect x="0" y="24" width="220" height="42" rx="8" fill="#F8F9FA" stroke="#CBD5E1" stroke-width="1" />
        <text x="12" y="50" fill="#94A3B8" font-size="13">Type answer…</text>
        <rect x="228" y="24" width="67" height="42" rx="8" fill="#2B6CB0" />
        <text x="261" y="50" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">Submit</text>
      </g>

      <!-- Skip Button -->
      <text x="167" y="395" fill="#6C7A89" font-size="13" font-weight="500" text-anchor="middle">Skip this question</text>
    </g>
  </g>

</svg>