<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <title>06 Calm Mode (Scenario 4)</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-weight: 700; fill: #1A1F26; }
      .subtitle { font-weight: 400; fill: #4A5568; }
      .label { font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; font-size: 11px; }
      .btn-text { font-weight: 600; font-size: 15px; text-anchor: middle; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="375" height="812" fill="#F8F9FA" />
  
  <!-- Header Bar -->
  <g id="Header" transform="translate(20, 20)">
    <rect width="28" height="28" rx="6" fill="#2B6CB0" />
    <text x="14" y="19" fill="#FFFFFF" font-weight="700" font-size="13" text-anchor="middle">NS</text>
    <text x="36" y="20" fill="#1A1F26" font-weight="700" font-size="16">NextStep</text>
    <text x="335" y="19" fill="#6C7A89" font-size="11" text-anchor="end">HAZHTeq Prototype</text>
    <line x1="0" y1="36" x2="335" y2="36" stroke="#E2E8F0" stroke-width="1" />
  </g>
  
  
  <!-- Screen: Calm Mode (Scenario 4) -->
  <rect width="375" height="812" fill="#F4F6F4" />
  <g id="Screen_CalmMode" transform="translate(20, 80)">
    <rect width="90" height="24" rx="12" fill="#E2ECE5" />
    <circle cx="12" cy="12" r="4" fill="#2E5A44" />
    <text x="22" y="16" fill="#2E5A44" font-weight="700" font-size="10">CALM SPACE</text>
    
    <text x="0" y="55" fill="#1C2D24" font-weight="700" font-size="22">You don't have to solve</text>
    <text x="0" y="80" fill="#1C2D24" font-weight="700" font-size="22">everything right now.</text>
    
    <text x="0" y="115" fill="#486153" font-size="14">When work, exams, and family all feel heavy</text>
    <text x="0" y="135" fill="#486153" font-size="14">at once, feeling exhausted makes complete sense.</text>
    
    <!-- Manageable Options -->
    <g id="Calm_Options" transform="translate(0, 165)">
      <rect width="335" height="195" rx="14" fill="#FFFFFF" stroke="#D1DED5" stroke-width="1" />
      <text x="16" y="28" fill="#486153" class="label">LET'S FOCUS ON WHAT YOU NEED IN THIS MOMENT:</text>
      
      <g transform="translate(16, 42)">
        <rect width="303" height="42" rx="8" fill="#FFFFFF" stroke="#D1DED5" stroke-width="1" />
        <text x="14" y="26" fill="#1C2D24" font-size="13" font-weight="600">Talk through what's happening</text>
        <text x="285" y="26" fill="#486153" font-size="13">→</text>
      </g>
      <g transform="translate(16, 92)">
        <rect width="303" height="42" rx="8" fill="#FFFFFF" stroke="#D1DED5" stroke-width="1" />
        <text x="14" y="26" fill="#1C2D24" font-size="13" font-weight="600">Focus on the next few minutes</text>
        <text x="285" y="26" fill="#486153" font-size="13">→</text>
      </g>
      <g transform="translate(16, 142)">
        <rect width="303" height="42" rx="8" fill="#FFFFFF" stroke="#D1DED5" stroke-width="1" />
        <text x="14" y="26" fill="#1C2D24" font-size="13" font-weight="600">Reach someone I trust</text>
        <text x="285" y="26" fill="#486153" font-size="13">→</text>
      </g>
    </g>

    <!-- Support Box -->
    <g id="Helpline_Box" transform="translate(0, 380)">
      <rect width="335" height="120" rx="14" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5" />
      <text x="16" y="28" fill="#166534" font-weight="700" font-size="13">Immediate support is always available:</text>
      <text x="16" y="52" fill="#14532D" font-size="12">Tele-MANAS (Govt. of India 24x7 Helpline)</text>
      
      <g transform="translate(16, 64)">
        <rect width="130" height="34" rx="8" fill="#166534" />
        <text x="65" y="22" fill="#FFFFFF" font-weight="700" font-size="13" text-anchor="middle">📞 Call 14416</text>
      </g>
      <text x="16" y="112" fill="#166534" font-size="10">NextStep does not replace crisis or healthcare professionals.</text>
    </g>
  </g>

</svg>