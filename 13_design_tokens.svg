<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812">
  <title>13 Design Tokens &amp; System</title>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .title { font-weight: 700; fill: #1A1F26; }
      .subtitle { font-weight: 400; fill: #4A5568; }
      .label { font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; font-size: 11px; }
      .btn-text { font-weight: 600; font-size: 15px; text-anchor: middle; }
    </style>
  </defs>
  <!-- Background -->
  <rect width="375" height="812" fill="#F8F9FA" />
  
  <!-- Header Bar -->
  <g id="Header" transform="translate(20, 20)">
    <rect width="28" height="28" rx="6" fill="#2B6CB0" />
    <text x="14" y="19" fill="#FFFFFF" font-weight="700" font-size="13" text-anchor="middle">NS</text>
    <text x="36" y="20" fill="#1A1F26" font-weight="700" font-size="16">NextStep</text>
    <text x="335" y="19" fill="#6C7A89" font-size="11" text-anchor="end">HAZHTeq Prototype</text>
    <line x1="0" y1="36" x2="335" y2="36" stroke="#E2E8F0" stroke-width="1" />
  </g>
  
  
  <!-- Design Tokens Sheet -->
  <g id="Design_Tokens" transform="translate(20, 60)">
    <text x="0" y="20" class="title" font-size="20">NextStep Mini Design System</text>
    
    <!-- Colors -->
    <g transform="translate(0, 40)">
      <text x="0" y="0" class="label" fill="#6C7A89">COLOR TOKENS</text>
      
      <!-- Primary Blue -->
      <rect x="0" y="10" width="70" height="50" rx="6" fill="#2B6CB0" />
      <text x="0" y="72" fill="#1A1F26" font-size="11" font-weight="600">Primary</text>
      <text x="0" y="84" fill="#6C7A89" font-size="10">#2B6CB0</text>
      
      <!-- Surface -->
      <rect x="85" y="10" width="70" height="50" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <text x="85" y="72" fill="#1A1F26" font-size="11" font-weight="600">Surface</text>
      <text x="85" y="84" fill="#6C7A89" font-size="10">#FFFFFF</text>
      
      <!-- Calm Accent -->
      <rect x="170" y="10" width="70" height="50" rx="6" fill="#2E5A44" />
      <text x="170" y="72" fill="#1A1F26" font-size="11" font-weight="600">Calm Sage</text>
      <text x="170" y="84" fill="#6C7A89" font-size="10">#2E5A44</text>
      
      <!-- Warning -->
      <rect x="255" y="10" width="70" height="50" rx="6" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1" />
      <text x="255" y="72" fill="#1A1F26" font-size="11" font-weight="600">Warning</text>
      <text x="255" y="84" fill="#6C7A89" font-size="10">#FFFBEB</text>
    </g>

    <!-- Typography -->
    <g transform="translate(0, 160)">
      <text x="0" y="0" class="label" fill="#6C7A89">TYPOGRAPHY HIERARCHY</text>
      <text x="0" y="28" font-size="24" font-weight="700" fill="#1A1F26">Display Large (24px Bold)</text>
      <text x="0" y="56" font-size="18" font-weight="600" fill="#1A1F26">Section Title (18px Semibold)</text>
      <text x="0" y="82" font-size="15" font-weight="400" fill="#4A5568">Body Text (15px Normal, 1.65 line-height)</text>
      <text x="0" y="104" font-size="12" font-weight="600" fill="#6C7A89">LABEL CAPTION (12px Uppercase)</text>
    </g>

    <!-- Spacing & Touch targets -->
    <g transform="translate(0, 290)">
      <text x="0" y="0" class="label" fill="#6C7A89">TOUCH TARGETS &amp; SPACING</text>
      <rect x="0" y="15" width="335" height="48" rx="8" fill="#F1F3F5" stroke="#CBD5E1" stroke-width="1" />
      <text x="16" y="44" fill="#1A1F26" font-size="13" font-weight="600">Min 48px Accessible Touch Target</text>
      <text x="320" y="44" fill="#2B6CB0" font-size="12" text-anchor="end">48px height</text>
    </g>
  </g>

</svg>